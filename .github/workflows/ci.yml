name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read
  # TEMP (audit 2026-10-31, revert with the diagnostic): post test-failure
  # details to the PR so they can be read outside the (egress-blocked) logs.
  pull-requests: write

jobs:
  verify:
    name: Clean install, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before `actions/setup-node` runs: its `cache: pnpm`
      # option resolves the pnpm binary while configuring the store cache, and
      # on a clean runner it fails with "Unable to locate executable file: pnpm".
      # The Vercel build resolves the same pinned pnpm through Corepack.
      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Vercel builds only 22.x and 24.x. An engines range that excludes both
      # (e.g. the Node 20 range this repository shipped with) fails the
      # deployment before the build starts, so it is blocked here instead.
      - name: Guard the Vercel build runtime
        run: |
          node -e "const e=require('./package.json').engines||{};if(!['22.x','24.x'].includes(e.node)){console.error('engines.node must be a Vercel-supported major (22.x or 24.x), found: '+e.node);process.exit(1);}console.log('engines.node OK: '+e.node)"

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Security and regression tests
        id: tests
        run: |
          # TEMP (audit 2026-10-31, to be reverted): keep the full log in CI,
          # and on failure post a compact "not ok" summary to the PR (the log
          # receiver is unreachable from the auditing sandbox).
          pnpm run test 2>&1 | tee /tmp/ci-test-output.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            set +e
            {
              echo "## CI test failure summary (temporary audit diagnostic)"
              echo
              echo "total log lines: $(wc -l < /tmp/ci-test-output.log)"
              echo '```'
              echo "──── not-ok lines ────"
              grep -E "^not ok" /tmp/ci-test-output.log | head -20 || echo "(none)"
              echo "──── per-workspace totals ────"
              grep -E "test: # (tests|pass|fail)" /tmp/ci-test-output.log | tail -12 || echo "(none)"
              echo "──── tail of log ────"
              tail -40 /tmp/ci-test-output.log
              echo '```'
            } > /tmp/ci-failure-comment.md
            curl -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @/tmp/ci-failure-comment.md -o /dev/null
            echo "curl exit: $?"
            exit 1
          fi

      - name: Production build
        run: pnpm run build

      - name: Verify Vercel function package
        run: pnpm run verify:vercel
