name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read

jobs:
  verify:
    name: Clean install, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Security and regression tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Verify Vercel function package
        run: pnpm run verify:vercel
