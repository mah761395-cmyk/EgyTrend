name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/**

permissions:
  contents: read
  # TEMP (audit 2026-10-31, revert with the diagnostic): post test-failure
  # details to the PR so they can be read outside the (egress-blocked) logs.
  pull-requests: write

jobs:
  verify:
    name: Clean install, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before `actions/setup-node` runs: its `cache: pnpm`
      # option resolves the pnpm binary while configuring the store cache, and
      # on a clean runner it fails with "Unable to locate executable file: pnpm".
      # The Vercel build resolves the same pinned pnpm through Corepack.
      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Use the pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Vercel builds only 22.x and 24.x. An engines range that excludes both
      # (e.g. the Node 20 range this repository shipped with) fails the
      # deployment before the build starts, so it is blocked here instead.
      - name: Guard the Vercel build runtime
        run: |
          node -e "const e=require('./package.json').engines||{};if(!['22.x','24.x'].includes(e.node)){console.error('engines.node must be a Vercel-supported major (22.x or 24.x), found: '+e.node);process.exit(1);}console.log('engines.node OK: '+e.node)"

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Security and regression tests
        id: tests
        run: |
          # TEMP DIAGNOSTIC BRANCH ONLY (audit 2026-10-31): capture the test
          # output to a file, then surface a failure summary as a job
          # annotation (readable via the check-runs API from the sandbox).
          set +e
          pnpm run test > /tmp/ci-test-output.log 2>&1
          RC=$?
          cat /tmp/ci-test-output.log
          if [ "$RC" -ne 0 ]; then
            N=$(wc -l < /tmp/ci-test-output.log)
            echo "::error file=.github/workflows/ci.yml::DIAG: pnpm test exit=$RC log_lines=$N"
            grep -E "^not ok" /tmp/ci-test-output.log | head -6 | while IFS= read -r l; do
              echo "::error file=.github/workflows/ci.yml::DIAG notok: ${l:0:300}"
            done
            echo "::error file=.github/workflows/ci.yml::DIAG totals: $(grep -E 'test: # (tests|pass|fail)' /tmp/ci-test-output.log | tail -12 | tr '\n' '|')"
            echo "::error file=.github/workflows/ci.yml::DIAG lastline: $(tail -1 /tmp/ci-test-output.log | cut -c1-300)"
            exit 1
          fi
          exit 0

      - name: Production build
        run: pnpm run build

      - name: Verify Vercel function package
        run: pnpm run verify:vercel
